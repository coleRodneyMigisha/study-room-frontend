      - northbound
      - southbound
      - OpenFlow
      - flow table
      - group table
      - meter table
    idealAnswer: "Northbound APIs connect the controller to applications; southbound APIs, such as OpenFlow, connect it to network devices. The tables are the flow table (match and actions), group table and meter table (rate limiting)."
  - question: Describe Cisco ACI, its components and the spine-leaf topology.
    kind: short
    marks: 6
    keywords:
      - APIC
      - Application Network Profile
      - Nexus 9000
      - spine
      - leaf
      - one hop
    idealAnswer: "ACI is Cisco's purpose-built hardware SDN solution. Components: the Application Network Profile (endpoint groups and policies), the APIC controller that translates policy into configuration, and Nexus 9000 switches. In a spine-leaf topology every leaf connects to every spine and leaves never connect to each other, so everything is one hop away. APIC does not manipulate the data path directly."
  - question: Compare JSON, YAML and XML syntax, giving the same small example in each.
    kind: long
    marks: 8
    keywords:
      - braces
      - brackets
      - double quotes
      - indentation
      - tags
      - key/value
    idealAnswer: "JSON uses braces for objects, brackets for arrays, double-quoted keys, colons between key and value and commas between pairs, e.g. {\"name\": \"R1\", \"vlans\": [10, 20]}. YAML is a superset of JSON that uses indentation and hyphens and no braces or commas: name: R1 then vlans: with - 10 and - 20. XML uses tags like <name>R1</name> and repeated tags for lists."
  - question: Explain how REST works, including its constraints, the mapping of HTTP methods to CRUD, and the parts of a RESTful request.
    kind: long
    marks: 10
    keywords:
      - client-server
      - stateless
      - cacheable
      - POST
      - GET
      - PUT
      - DELETE
      - query
      - API key
    idealAnswer: "REST is a web API style over HTTP, constrained to be client-server, stateless and cacheable. CRUD maps to HTTP methods: POST create, GET read, PUT or PATCH update, DELETE delete; status 200 is success. A request consists of the API server, the resource path and a query with format, key and parameters. The key authenticates users, limits requests and tracks usage. It can be called from a browser, Postman, Python or RESTCONF."
  - question: Compare Ansible, Chef, Puppet and SaltStack, then explain intent-based networking and the role of Cisco DNA Center.
    kind: long
    marks: 10
    keywords:
      - agentless
      - playbook
      - cookbook
      - manifest
      - pillar
      - translation
      - activation
      - assurance
      - overlay
      - underlay
    idealAnswer: "Ansible: Python and YAML, agentless, playbooks. Chef: Ruby, agent-based, Chef Master, cookbooks. Puppet: Ruby, agent or agentless, Puppet Master, manifests. SaltStack: Python, both modes, Salt Master, pillar. Intent-based networking builds on SDN: it translates business intent into policy, activates it on devices and gives assurance through analytics. The fabric has a logical overlay (IPsec or CAPWAP encapsulation) running over the physical underlay. Cisco DNA Center delivers this with Design, Policy, Provision, Assurance and Platform areas, supporting SD-Access, SD-WAN, assurance and security."
fact:
  title: Spine-leaf and East-West traffic
  body: Spine-leaf fabrics were adopted in data centres because virtualisation made most traffic East-West. Every server is the same number of hops from every other, so latency is predictable.
