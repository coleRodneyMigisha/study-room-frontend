  - question: "Define inside local, inside global, outside local and outside global, using PC1 192.168.10.10 and a server 209.165.201.1 with public address 209.165.200.226. [4 marks]"
    kind: short
    marks: 4
    keywords:
      - inside local
      - inside global
      - outside local
      - outside global
      - 192.168.10.10
      - 209.165.200.226
    idealAnswer: "Inside local: the private address of the inside host, 192.168.10.10 (1). Inside global: the public address representing it on the internet, 209.165.200.226 (1). Outside global: the real address of the destination, 209.165.201.1 (1). Outside local: the destination's address as seen from the inside, normally also 209.165.201.1 (1)."
  - question: "Compare static NAT, dynamic NAT and PAT, with one use for each. [6 marks]"
    kind: short
    marks: 6
