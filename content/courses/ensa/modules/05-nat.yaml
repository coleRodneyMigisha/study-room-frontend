      - port
      - server
    idealAnswer: "Static NAT is a permanent one-to-one mapping, used for servers that must be reachable from the internet (2). Dynamic NAT assigns a public address from a pool, first come first served, so enough addresses are needed for the simultaneous sessions (2). PAT (overload) maps many private addresses to one or a few public addresses, using source port numbers to distinguish them; it suits ordinary internet access for many users (2)."
  - question: "Explain how PAT assigns source ports and describe what happens when two hosts use the same source port. [5 marks]"
    kind: short
    marks: 5
    keywords:
      - original source port
      - next available
      - 0–511
      - 512–1023
      - 1024–65535
      - next address
    idealAnswer: "PAT tries to preserve the original source port (1). If it is already in use, it assigns the first available port from the same group: 0–511, 512–1023 or 1024–65535 (2). When the group is exhausted it moves to the next address in the pool (1). Example: two hosts both using 1444 are shown as 209.165.200.225:1444 and 209.165.200.225:1445 (1)."
  - question: "List four advantages and four disadvantages of NAT. [8 marks]"
    kind: long
    marks: 8
    keywords:
      - conserves
      - hides
      - flexibility
      - delay
      - end-to-end
      - traceability
      - IPsec
      - tunnelling
    idealAnswer: "Advantages (any four, 1 each): conserves public IPv4 addresses; PAT gives port-level multiplexing; flexibility in connecting to the internet; consistent internal addressing; easy readdressing when the ISP changes; hides internal addresses. Disadvantages (any four, 1 each): added forwarding delay; loss of end-to-end addressing; loss of traceability; complicates tunnelling protocols such as IPsec; outside-initiated and some UDP services are disrupted; troubleshooting is harder."
  - question: "Write the IOS configuration for dynamic NAT using the pool 209.165.200.226–209.165.200.240 (mask 255.255.255.224) for inside network 192.168.0.0/16. State how to verify it. [8 marks]"
    kind: long
    marks: 8
    keywords:
      - ip nat pool
      - access-list
      - 0.0.255.255
      - ip nat inside source list
      - ip nat inside
      - ip nat outside
      - show ip nat translations
    idealAnswer: "ip nat pool NAT-POOL1 209.165.200.226 209.165.200.240 netmask 255.255.255.224 (2). access-list 1 permit 192.168.0.0 0.0.255.255 (2). ip nat inside source list 1 pool NAT-POOL1 (2). Under the LAN interface ip nat inside and under the WAN interface ip nat outside (1). Verify with show ip nat translations and show ip nat statistics; clear ip nat translation * to reset (1)."
  - question: "Convert the dynamic configuration of Question 5 to PAT using only the address on Serial0/1/1, and explain why the number of inside hosts is then no longer limited by the pool size. [5 marks]"
    kind: short
    marks: 5
    keywords:
      - overload
      - interface serial 0/1/1
      - port
      - source port
      - 64,512
    idealAnswer: "ip nat inside source list 1 interface serial 0/1/1 overload (2), keeping the ACL and the inside and outside interface markings (1). Each translation is identified by the address and source port, so one address can carry tens of thousands of simultaneous conversations (up to about 64,512 in the 1024–65535 group) (2)."
  - question: "Explain what NAT64 is and distinguish it from IPv6 unique local addresses. [4 marks]"
    kind: short
    marks: 4
    keywords:
      - NAT64
      - IPv6-only
      - IPv4-only
      - ULA
      - temporary
      - local
    idealAnswer: "NAT64 translates between IPv6-only and IPv4-only networks and is a temporary aid during migration (2). ULAs are the IPv6 equivalent of RFC 1918 private addresses and are for local use only; they are not translated by NAT64 into public IPv6 (2)."
lab:
  title: NAT numbers
  variations:
    - title: Usable addresses in a pool
      question: "A pool is defined as <code>ip nat pool P 209.165.200.226 209.165.200.240 netmask 255.255.255.224</code>. How many addresses does it contain?"
      answer: 15
      tolerance: 0
      hint: Count inclusively. Last minus first plus one.
      explanation: 240 − 226 + 1 = 15 addresses.
      unit: addresses
    - title: A larger pool
      question: "A pool runs from <code>203.0.113.33</code> to <code>203.0.113.62</code>. How many addresses does it hold?"
      answer: 30
      tolerance: 0
      hint: Last minus first plus one.
      explanation: 62 − 33 + 1 = 30. This is exactly the usable host range of 203.0.113.32/27.
      unit: addresses
    - title: Simultaneous hosts under dynamic NAT
      question: "A dynamic NAT pool has 15 addresses and 200 inside hosts try to reach the internet at the same time. How many hosts are translated at once?"
      answer: 15
      tolerance: 0
      hint: Dynamic NAT is one-to-one while a translation exists.
      explanation: Each active host uses one pool address, so only 15 are translated. The other 185 are dropped until entries free up.
      unit: hosts
    - title: PAT port assigned
      question: "R2 already has an entry using <code>209.165.200.225:1444</code>. A second host also uses source port 1444. Which source port does PAT assign it (taking the next available port)?"
      answer: 1445
      tolerance: 0
      hint: PAT keeps the original port if free, otherwise takes the next available one in the same group.
      explanation: 1444 is taken, so the next available port in the 1024–65535 group is 1445.
    - title: Ports in the top PAT group
      question: "How many ports are in the 1024–65535 PAT group on one address?"
      answer: 64512
      tolerance: 0
      hint: Last minus first plus one.
      explanation: 65,535 − 1,024 + 1 = 64,512, so one address supports up to 64,512 simultaneous translations there.
      unit: ports
    - title: Addresses in 172.16.0.0/12
      question: "How many addresses are in the RFC 1918 block <code>172.16.0.0/12</code>?"
      answer: 1048576
      tolerance: 0
      hint: 32 minus 12 host bits, then 2 to that power.
      explanation: 2^20 = 1,048,576 addresses, from 172.16.0.0 to 172.31.255.255.
      unit: addresses
