id: fastapi-serving
title: API Engineering with FastAPI, Pydantic & Async Workers
subtitle: Building a fast, well-checked web service that answers prediction requests
recap: |
  Put the model behind a FastAPI web service, so other systems can ask it for predictions over the internet
  (HTTP). Pydantic checks every field of every request at the door (age between 0 and 120, glucose above 0,
  categories from an allowed list) and replies with an HTTP 422 error instead of letting bad input crash the
  model. Use async code for work that waits (databases, network calls), and several worker processes for heavy
  number-crunching like making predictions. Little's Law, L = λ·W, links how many requests arrive per second,
  how long each takes, and how many are being handled at once.
traps:
  - Doing heavy prediction work directly inside an async function. It blocks the event loop, so every other
    request waits.
  - Checking inputs inside the model code instead of at the API's front door (with Pydantic).
  - Forgetting to turn milliseconds into seconds in Little's Law (45 ms = 0.045 s).
  - Quoting the FastAPI vs Django numbers (67.8 vs 10.1 req/s) without saying they come from one study on an
    I/O-bound workload.
  - "Saying code that compiles or passes a scanner is secure: business-logic flaws like mass assignment and
    race conditions slip past both."
  - Parsing the request body before checking the key or size, which lets one huge upload crash the server with
    an out-of-memory error.
  - Mixing up authentication (who are you) with authorization (what may you do), or putting gRPC on the public
    side instead of REST.
lesson:
  checkpointStep: 3
  steps:
    - A model saved on disk can't help a single patient by itself. We put it inside a REST API, a web service,
      so websites, the hospital's electronic health record (EHR) system and mobile apps can ask it for
      predictions over HTTP.
    - FastAPI is the standard tool for serving Python ML models. Built on Starlette and Pydantic, it handles
      many requests at once (asynchronously), converts data to and from JSON automatically, and writes its own
      documentation page.
    - "With Pydantic schemas, every patient detail in a request is strictly checked at the API's front door:
      age must be between 0 and 120, avg_glucose_level must be positive, and text fields must be one of the
      allowed choices."
    - "Checkpoint: why should prediction services run on asynchronous web frameworks, and how does Pydantic
      stop the model code from crashing?"
    - Pydantic catches wrong types, missing fields and impossible values before your model code is touched,
      and replies with a clear HTTP 422 (Unprocessable Entity) error instead of the server crashing.
    - To handle as many requests as possible, separate work that waits (logging to a database, writing audit
      records) from heavy number-crunching (the prediction itself), and use several Uvicorn worker processes
      or a thread pool for the heavy part.
checkpoint:
  question: How does Pydantic schema validation enforce data contracts at the API boundary, and why is this
    critical for maintaining 99.9% uptime in production healthcare ML?
  hint: What should happen if an app sends the text "twenty" instead of a number for BMI, or a negative glucose
    level? Checking at the door gives a clear 422 error; what happens if the bad value reaches the model
    instead (a 500 Internal Server Error)?
  keywords:
    - pydantic
    - schema
    - validation
    - data contract
    - type enforcement
    - "422"
    - boundary
    - uptime
    - crash
    - sanitization
  idealAnswer: "Pydantic enforces a data contract (the agreed rules for each field) at the boundary of the
    service, before a request ever reaches the model. The schema enforces types (type enforcement: turning
    number-text like \"67\" into a number where that's valid), rejects unknown or malformed fields, and checks
    the allowed values (e.g. Field(..., ge=0, le=120) for age, or a fixed list of smoking statuses). If
    invalid data arrives, FastAPI replies straight away with a structured HTTP 422 response naming the exact
    field and problem. In a hospital service, this validation (input sanitization) stops unhandled Python
    errors (like a ValueError inside scikit-learn) that would crash the request, prevents missing values
    silently turning into wrong predictions, and keeps the service reliable, protecting its 99.9% uptime."
terms:
  - term: API / REST API
    definition: A web service with addresses (like /predict) that other programs send requests to and get answers from.
  - term: FastAPI
    definition: A modern, fast Python framework for building APIs, built on Starlette and Pydantic.
  - term: Pydantic BaseModel
    definition: A class where you write the expected fields and their types and limits; Pydantic checks every
      request against it.
  - term: HTTP 422
    definition: '"Unprocessable Entity": the request was valid JSON, but its contents broke the rules.'
  - term: Uvicorn
    definition: The program (an ASGI web server) that actually runs a FastAPI app and handles the network connections.
  - term: async (asynchronous)
    definition: Code that can pause while waiting (for a database or network) and let other requests run meanwhile.
  - term: CPU-bound vs I/O-bound
    definition: CPU-bound work keeps the processor busy (making predictions); I/O-bound work mostly waits (for
      disks, databases, networks).
  - term: Throughput (QPS)
    definition: Queries per second, i.e. how many requests the service completes each second.
  - term: Latency (and p99)
    definition: How long one request takes. p99 is the time the slowest 1% of requests exceed.
  - term: ASGI
    definition: A Python server standard that lets one process juggle many waiting requests with an event loop;
      FastAPI uses it.
  - term: WSGI
    definition: The older Python server standard where each request holds a thread that sits idle during I/O;
      Django traditionally uses it.
  - term: Cursor pagination
    definition: Returning a long list one page at a time, with a next_cursor value the client sends back to get
      the next page.
  - term: gRPC
    definition: An RPC-style API that calls named operations on another machine using Protocol Buffers over
      HTTP/2, typical for internal service calls.
  - term: Bearer token
    definition: A secret string sent with each request in the Authorization header to prove who the caller is.
  - term: RBAC (role-based access control)
    definition: Granting permissions by role, such as nurse or admin, instead of person by person.
  - term: Mass assignment
    definition: A flaw where a client can set fields it should not, such as a role field that lets a user sign up
      as admin.
  - term: SAST vs DAST
    definition: SAST reads the code without running it, while DAST attacks the running API; each catches flaws the
      other misses.
  - term: OpenAPI
    definition: A machine-readable contract describing every endpoint, used to generate docs, client SDKs, mocks
      and fuzz tests.
  - term: HTTP 429 and Retry-After
    definition: The status code a rate limiter returns when a caller sends too many requests, with a header saying
      how long to wait.
quiz:
  - question: "A hospital client sends {'age': -5, 'bmi': 'obese'} to a FastAPI endpoint requiring float bmi and
      age > 0. What happens?"
    options:
      - The server crashes with 500 Internal Server Error
      - FastAPI automatically catches validation errors and returns 422 Unprocessable Entity
      - The model converts -5 to 0 and predicts anyway
      - The request hangs indefinitely
    answer: 1
    explanation: Pydantic checks the request the moment it arrives, rejects the bad fields (a negative age, text
      for BMI) and replies with a clear 422 error. The model code never runs.
  - question: What is Little's Law relating Concurrency (L), Throughput (λ), and Latency (W)?
    options:
      - L = λ × W
      - L = λ / W
      - L = λ + W
      - W = L × λ²
    answer: 0
    explanation: "The average number of requests being handled at once (L) equals how many arrive per second (λ)
      times how long each takes (W): L = λ × W."
  - question: An invalid field in a FastAPI request body returns…
    options:
      - 200
      - 400
      - 422
      - 500
    answer: 2
    explanation: "When Pydantic rejects a field, FastAPI replies with 422 Unprocessable Entity: valid JSON,
      invalid contents."
  - question: Why can a CPU-heavy predict() inside async def hurt throughput?
    options:
      - It is not allowed
      - It blocks the event loop so other requests wait
      - It uses more memory
      - It disables validation
    answer: 1
    explanation: While it calculates, it blocks the event loop, so no other request is served. Use plain def (a
      thread pool) or more workers for heavy work.
  - question: λ = 200 req/s, W = 15 ms. L = ?
    options:
      - "3"
      - "13.3"
      - "30"
      - "0.075"
    answer: 0
    explanation: Turn 15 ms into seconds (0.015 s), then L = 200 × 0.015 = 3 requests in progress.
  - question: What does Literal['never','formerly','smokes'] enforce?
    options:
      - A string of any value
      - Only those exact category values
      - A number
      - Nothing at runtime
    answer: 1
    explanation: The field must be exactly one of those words. Anything else is rejected with 422.
  - question: Utilisation rises from 50% to 90%. Roughly what happens to queueing latency?
    options:
      - Stays the same
      - Doubles
      - About 5× higher
      - Halves
    answer: 2
    explanation: "Using W ≈ S ÷ (1 − ρ), the wait goes from 2S to 10S: about 5× longer."
  - question: Where should the model be loaded in a multi-worker deployment?
    options:
      - Per request
      - Once per worker at startup
      - Once per day by cron
      - In the client
    answer: 1
    explanation: Once per worker, at startup. Each worker process needs its own copy in memory.
  - question: Which role of an API is a trained model sitting behind a web address that returns a prediction?
    options:
      - Orchestrator
      - Model endpoint
      - Tool for AI agents
      - Composite API
    answer: 1
    explanation: A model endpoint takes data or an image and returns a prediction. An orchestrator drives other
      tools, and agents call APIs as tools.
  - question: In the cited I/O-bound study, FastAPI reached 67.8 req/s and Django 10.1 req/s. About what is the
      throughput ratio?
    options:
      - About 3.7 times
      - About 4.4 times
      - About 7.4 times
      - About 6.7 times
    answer: 3
    explanation: 67.8 / 10.1 = 6.71. The 7.4 figure is the latency ratio (48,841 / 6,634 = 7.36).
  - question: Which is the correct order of serving a model?
    options:
      - Receive, load, predict, prepare, respond
      - Load, receive, prepare, predict, respond
      - Load, prepare, receive, respond, predict
      - Prepare, load, receive, predict, respond
    answer: 1
    explanation: Weights load once at start-up. Each request is then received, prepared, predicted and answered.
  - question: With 7 books (ids 1 to 7), limit=3 and after=3, what does list_books return?
    options:
      - Books 4, 5, 6 and next_cursor 6
      - Books 4, 5, 6, 7 and next_cursor None
      - Books 3, 4, 5 and next_cursor 5
      - Book 7 and next_cursor None
    answer: 0
    explanation: Ids greater than 3 are 4 to 7. The first 3 are 4, 5, 6, which fills the limit, so next_cursor is
      the last id, 6.
  - question: Which is a correct front-door defence for a model API?
    options:
      - Parse the whole JSON first, then check the key
      - Trust scanners to find logic flaws
      - Answer HTTP 429 with a Retry-After header when a key sends too many requests
      - Use gRPC for all public clients
    answer: 2
    explanation: Rate limiting returns 429 with Retry-After. Parsing before checking causes the OOM flaw, and REST
      is preferred for external clients.
  - question: An LLM-generated API let users sign up as admin because of an inherited role field. What is this
      flaw called?
    options:
      - Race condition
      - Execution ordering
      - Human-in-the-loop paradox
      - Mass assignment
    answer: 3
    explanation: Mass assignment means a client can set a field it should not. The others are locking, ordering
      and shallow-review flaws.
fact:
  title: FastAPI + Pydantic v2 Performance
  body: Pydantic v2 was completely rewritten in Rust, delivering 5× to 50× faster JSON parsing and validation.
    This allows a single FastAPI worker to validate thousands of patient payloads per second with
    sub-millisecond CPU overhead.
lab:
  title: FastAPI Model Serving, Pydantic Schema Validation & Latency Simulator
  variations:
    - title: Little's Law API Concurrency Capacity
      question: A stroke screening endpoint handles an arrival rate <b>λ = 250 requests/sec</b> with average model
        inference latency <b>W = 40 ms (0.040s)</b>. According to Little's Law (<code>L = λ × W</code>), how
        many concurrent requests are in flight on the server?
      answer: 10
      tolerance: 0.1
      hint: Multiply 250 req/s by 0.040s.
      explanation: L = 250 × 0.040 = 10 concurrent requests in flight. This dictates the minimum worker pool sizing
        needed to prevent request queuing.
    - title: FastAPI Uvicorn Concurrency Sizing
      question: A Uvicorn worker process handles up to <b>50 concurrent async requests</b>. To support a peak
        concurrent capacity of <b>200 active requests</b> without queuing, how many worker processes must be
        spawned via Gunicorn?
      answer: 4
      tolerance: 0
      hint: Divide 200 by 50.
      explanation: 200 / 50 = 4 workers. Typically, 2 to 4 workers per CPU core maximize asynchronous I/O throughput.
    - title: Edge Pydantic Validation CPU Savings
      question: Pydantic rejects an invalid payload (e.g., negative glucose) at the API boundary in <b>1.2 ms</b>.
        If unvalidated, passing the bad input into scikit-learn causes a crash after <b>18.5 ms</b> of
        pipeline execution. How many <b>ms</b> of CPU execution time are saved per bad request?
      answer: 17.3
      tolerance: 0.1
      hint: Subtract 1.2 ms from 18.5 ms.
      explanation: 18.5 − 1.2 = 17.3 ms saved per rejected request, shielding CPU inference workers from wasted compute.
notes:
  - heading: Why an API
    body: |
      **The idea:** a model file on a disk is like a doctor locked in a room. An API is the reception desk: anyone can hand in a form and get an answer back.

      A model file can't help a nurse doing triage by itself. Wrapping it in a **REST API** (a web service) lets any system (the hospital's electronic health record, a mobile app, a dashboard) send patient details over the internet (HTTP) and get a prediction back as JSON.

      **FastAPI** is the usual choice for serving Python ML models. It's built on Starlette (for handling web requests) and **Pydantic** (for checking data), it writes interactive documentation for you at `/docs`, and it's fast enough that the model, not the framework, decides the speed.
  - heading: Pydantic contracts and HTTP 422
    body: |
      **The idea:** a form with boxes that only accept the right kind of answer. Write "twenty" in the age box and the form is handed straight back, before it ever reaches the doctor.

      ```python
      class Patient(BaseModel):
          age: float = Field(ge=0, le=120)                       # between 0 and 120
          avg_glucose_level: float = Field(gt=0, le=400)         # more than 0, up to 400
          bmi: float | None = Field(default=None, ge=10, le=80)  # optional
          hypertension: bool                                      # true or false
          smoking_status: Literal["never", "formerly", "smokes", "unknown"]   # only these values

      @app.post("/predict")
      def predict(p: Patient) -> Prediction: ...
      ```

      Every request is checked **at the front door**: wrong types, missing required fields, out-of-range values and unknown categories are rejected with **HTTP 422 (Unprocessable Entity)**, plus a JSON message naming the exact field and problem. Your model code never sees invalid input, so it can't crash, or, worse, give a prediction for an impossible patient.

      The schema is also documentation: the same rules appear on the `/docs` page for the people connecting other systems.
  - heading: Async, workers and CPU-bound inference
    body: |
      **The idea:** a waiter can look after many tables while their food cooks (waiting work). But while the waiter is busy cooking (heavy work), nobody else gets served. So hire more cooks.

      `async def` endpoints let one process juggle many requests that are **waiting**: on a database, a log write, another web call. But making a prediction is **CPU-bound** (it keeps the processor busy). While XGBoost is calculating, the event loop (the part that juggles requests) is blocked, and nothing else gets served.

      Options:

      - Write the endpoint with plain `def`: FastAPI then runs it in a **thread pool** (several helper threads).
      - Run several **Uvicorn workers** (separate processes): `uvicorn app.main:app --workers 4`, or Gunicorn with Uvicorn workers. Each worker loads its own copy of the model.
      - Send very heavy jobs to a queue (Celery or RQ) and reply with a job number to check later.

      Load the model **once per worker, at startup**, never per request.
  - heading: Little's Law and latency under load
    body: |
      **The idea:** if 2 customers walk into a shop every minute and each stays 5 minutes, there are about 10 customers inside at any time. Little's Law is exactly that.

      **Little's Law:** L = λ × W. The average number of requests being handled (L) = how many arrive per second (λ, "lambda") × how long each one takes on average (W, in seconds).

      **Tiny example:** 120 requests per second, each taking 25 ms = 0.025 s, gives L = 120 × 0.025 = **3** requests in progress on average.

      **Capacity:** with c workers, each taking S seconds per request, the service can finish c ÷ S requests per second. 4 workers × (1 ÷ 0.020 s) = **200 requests per second**. **Utilisation** ρ ("rho") = arrivals ÷ capacity: how busy the service is.

      **Waiting grows fast as you get busy.** A simple queueing rule of thumb: **W ≈ S ÷ (1 − ρ)**. At 50% busy, each request takes about 2× as long as normal; at 90% busy, about 10× as long; at 100% or more, the queue grows forever. That's why services are sized to run at about 60–70% busy, and why the **p99** latency (the time the slowest 1% of requests exceed) is watched, not just the average.
  - heading: Three roles of an API in an AI system
    body: |
      **In plain words:** an AI system uses APIs in three different ways: to run other tools for you, to let others use your model, and to let AI agents use outside services.

      An API (a set of rules that lets one program talk to another) shows up in AI projects in three roles.

      1. **Orchestrator.** A script drives another program through its API. In the deck, a Python script drove a design tool (Keysight ADS) to generate and collect training data. Think of a conductor telling each musician when to play.
      2. **Model endpoint.** A trained model sits behind a web address. A client sends data or an image and gets a prediction back. The client never sees the model's inside. Our stroke-risk API is this role: a clinic app sends patient details and receives a risk score.
      3. **Tool for AI agents.** Large language model (LLM) agents call APIs to reach outside services. Gorilla, a retriever-aware model, maps a question to an API specification and then calls the right endpoint. This only works because the API is described in a machine-readable way.

      Tiny example: a nurse's app posts a retinal photo to `/upload_file`. A person is the client. When an LLM agent sends the same request, the endpoint cannot tell the difference, and it should not need to.

      **Rule:** clients are not always people. Design the endpoint so a program can read its description, call it, and understand the reply.

      **Exam angle:** name all three roles and give one example of each. The role this module focuses on is the model endpoint.
  - heading: "ASGI vs WSGI: why blocking servers queue up"
    body: |
      **In plain words:** a blocking server makes a worker stand still while it waits. A non-blocking server uses that waiting time to help someone else.

      WSGI (the older Python web-server standard, used by Django) gives each request a thread (one line of work). When the thread waits for I/O (a database, an upload, a remote model call), it sits idle. Requests pile up in a queue, and users eventually see **504 Gateway Timeout** errors.

      ASGI (the newer standard, used by FastAPI) runs an **event loop**. When one request waits, the loop switches to another. Think of a waiter who takes your order, then serves other tables while the kitchen cooks, instead of standing at the kitchen door.

      The deck cites one study (ICECCO 2026) that compared FastAPI microservices with a monolithic Django setup on an **I/O-bound** workload:

      | | FastAPI | Django |
      |---|---|---|
      | Requests per second | 67.8 | 10.1 |
      | Average latency | 6,634 ms | 48,841 ms |

      That is over 6 times the throughput and about 7.3 times lower latency. Memory stayed stable under heavy traffic. The authors credit type hints and Pydantic for lower serialization overhead.

      **Careful:** this is one study, on an I/O-bound workload. It does not say FastAPI makes a heavy model compute faster. A CPU-bound step still blocks the loop (see the existing note on CPU-bound inference).

      **Exam angle:** state the numbers and say they come from an I/O-bound test.
  - heading: Serving a model in five steps
    body: |
      **In plain words:** serving a model means loading it once, then repeating the same four actions for each request.

      The deck's two real systems follow the same five steps:

      1. **Load:** pre-trained weights load into memory at start-up, once, not per request.
      2. **Receive:** an endpoint such as `POST /upload_file` takes a file or JSON.
      3. **Prepare:** preprocess the data in memory.
      4. **Predict:** run the in-memory model (inference).
      5. **Respond:** return class, confidence and an explanation as JSON.

      Think of a kitchen. The chef sets up the oven before opening (load). Then each order is taken, prepped, cooked and plated.

      Step 3 turns raw input into the exact format the model expects. For images: CLAHE contrast adjustment, then resize to 224 x 224 pixels. For CSV tables: load into a pandas DataFrame, clean column names, one-hot encode, then Min-Max scale.

      **System 1, diabetic retinopathy.** A user uploads a retinal fundus image through a multilingual chatbot. A pre-trained DenseNet121 model behind a FastAPI backend returns a real-time result in 3 classes: No DR, Mild/Moderate DR, Severe DR.

      **System 2, zero-day detection.** CSV network logs are uploaded to `POST /upload_file`, preprocessed with pandas, and checked by three models (Isolation Forest, Random Forest, LSTM). The reported accuracy is 98%. The OpenAI API adds plain-language threat descriptions.

      **Rule:** load once at start-up. A model that loads on every request makes every request slow.

      **Exam angle:** list the five steps in order and give the preparation step for one input type.
  - heading: Cursor pagination, REST vs gRPC and API-first design
    body: |
      **In plain words:** return long lists a page at a time, pick the right protocol for each side of your system, and write the contract before the code.

      **Cursor pagination.** A cursor is a bookmark. The server returns one page plus a `next_cursor`. The client sends it back to get the next page. This is the deck's Books API:

      ```python
      @app.get("/v1/books")
      def list_books(limit: int = 3, after: int = 0):
          ids = sorted(k for k in DB if k > after)[:limit]
          nxt = ids[-1] if len(ids) == limit else None
          return {"data": [DB[i] for i in ids], "next_cursor": nxt}
      ```

      A `next_cursor` of `None` means the last page.

      **REST vs gRPC.** REST exposes resources at web addresses and is preferred for external-facing interfaces. gRPC is an RPC-style API (Remote Procedure Call: run a function that lives on another machine). It sends data as Protocol Buffers, a compact binary format, over HTTP/2. It is typical for internal service-to-service calls. Short rule: **REST outside, gRPC inside**. The deck marks this as general engineering guidance, not a peer-reviewed result.

      **API-first with OpenAPI.** Write the OpenAPI contract (a machine-readable description of every endpoint) before the code. From it you can generate documentation, client SDKs, mocks and fuzz-testing scripts. FastAPI also publishes one for you.

      **What to measure.** Latency (time for one request), throughput (requests per second), the 95th percentile (the time within which 95% of requests finish), CPU, memory and SLA compliance (how often the agreed service level is met). The deck's example is a 459 ms average response time.

      **Exam angle:** know the one-line rule for REST vs gRPC and what a cursor is.
  - heading: "Securing a model API: identity, front-door defences and testing"
    body: |
      **In plain words:** first check who is calling, then stop bad requests at the door, then test the API from several angles.

      **Authentication vs authorization.** Authentication asks who is calling. Authorization asks what they may do. Tools: API keys (identify the calling application), bearer tokens (prove identity on each request, sent as `Authorization: Bearer <token>`), OAuth 2.0 (a standard token flow) and RBAC (role-based access control: permissions come from a role, such as nurse or admin).

      **Three front-door defences.**
      - **Validate input:** Pydantic rules (min_length, ge, le), and parameterized queries so user text cannot become SQL injection.
      - **Limit the rate:** a per-key limiter answers **HTTP 429** with a `Retry-After` header.
      - **Limit the size:** cap the request body before parsing the JSON, so huge uploads cannot exhaust memory.

      **Four flaws found in LLM-generated APIs** (IEEE Access 2026 study):
      - *Mass assignment:* an inherited `role` field let users sign up as admin.
      - *Execution ordering:* huge JSON was parsed before the key check, causing an OOM (out of memory) crash.
      - *Race conditions:* no row locking, so duplicate payments or webhooks.
      - *Human-in-the-loop paradox:* polished code invites shallow review.

      Code that compiles is not secure, and scanners miss business-logic flaws when the syntax looks valid.

      **Testing triangulation.** Use three methods because each catches what the others miss: **SAST** reads code without running it (Bandit, Semgrep); **DAST / fuzzing** attacks the running API (Schemathesis, RESTler); **manual** penetration tests follow OWASP WSTG.

      **Exam angle:** name the three defences and the four flaws, and say why one test type is not enough.
examples:
  - title: Little's Law
    problem: The stroke API handles 80 requests/s with an average latency of 45 ms. How many requests are in
      flight, on average?
    steps:
      - "Convert to seconds: W = 0.045 s."
      - L = λW = 80 × 0.045 = **3.6** requests.
    answer: 3.6 concurrent requests.
    takeaway: Concurrency, throughput and latency are tied together — fix two and you know the third.
  - title: How many workers?
    problem: Inference takes 20 ms. Peak traffic is 300 req/s and you want utilisation ≤ 70%. How many workers do
      you need?
    steps:
      - One worker serves 1000 / 20 = 50 req/s.
      - Needed capacity = 300 / 0.7 ≈ 429 req/s.
      - Workers = 429 / 50 ≈ 8.6 → **9 workers**.
      - "Check: 9 × 50 = 450 req/s, ρ = 300/450 = 67%; latency ≈ 20 / 0.33 ≈ 60 ms."
    answer: 9 workers.
    takeaway: Size for a target utilisation, not for 100% — queues explode near capacity.
  - title: Walking cursor pagination through 7 books
    problem: A DB has books with ids 1 to 7. The deck's list_books uses limit=3 and after=0 by default. Trace each
      call until the client reaches the last page.
    steps:
      - Call 1 is GET /v1/books with after=0. The ids greater than 0 are 1 to 7. Sorted and cut to the first
        3, we get ids 1, 2, 3.
      - len(ids) is 3, which equals limit, so nxt = ids[-1] = 3. The reply has data for books 1, 2, 3 and
        next_cursor 3.
      - Call 2 is GET /v1/books?after=3. Ids greater than 3 are 4, 5, 6, 7. The first 3 are 4, 5, 6. len is 3,
        so next_cursor is 6.
      - Call 3 is GET /v1/books?after=6. Only id 7 is greater than 6, so ids is [7]. len is 1, which is not 3,
        so next_cursor is None.
      - The client sees None and stops. It fetched 3 + 3 + 1 = 7 books in 3 calls.
      - "Edge case: with exactly 6 books, call 2 returns 4, 5, 6 with next_cursor 6. Call 3 then returns an
        empty list with next_cursor None. One extra call, but still correct."
    answer: "3 pages: ids 1,2,3 (next_cursor 3), ids 4,5,6 (next_cursor 6), id 7 (next_cursor None)."
    takeaway: The client never counts pages. It just sends back whatever next_cursor it was given, and stops when
      it is None.
  - title: Speedup ratios from the FastAPI vs Django study
    problem: The cited study (I/O-bound workload) measured FastAPI at 67.8 requests per second and 6,634 ms
      average latency, and Django at 10.1 requests per second and 48,841 ms. Compute both ratios and convert
      the latencies to seconds.
    steps:
      - "Throughput ratio: 67.8 / 10.1 = 6.71. FastAPI handled about 6.7 times the requests per second, which
        matches the deck's 'over 6x'."
      - "Latency ratio: 48,841 / 6,634 = 7.36. Django's average latency was about 7.4 times higher, close to
        the deck's '~7.3x lower'."
      - "In seconds: 6,634 ms is 6.634 s and 48,841 ms is 48.841 s."
      - "Time saved per request on average: 48,841 - 6,634 = 42,207 ms, about 42.2 s."
      - "Scope check: this was an I/O-bound workload, one study. It is not a claim about heavy model
        computation."
    answer: About 6.71 times the throughput and 7.36 times lower average latency, on that I/O-bound test.
    takeaway: Quote the numbers with their condition. Gains from async come from not blocking while waiting, so
      they apply to waiting-heavy workloads.
questions:
  - question: How does Pydantic protect the model code in a FastAPI service? Give two concrete validation rules
      for the stroke API.
    kind: short
    marks: 5
    keywords:
      - pydantic
      - schema
      - boundary
      - type
      - range
      - Field
      - ge
      - le
      - Literal
      - "422"
      - before model
    idealAnswer: "Pydantic validates every request against a schema before the endpoint runs; invalid input is
      rejected with HTTP 422 and a message naming the field, so model code never sees bad data. Examples: age:
      float = Field(ge=0, le=120); smoking_status: Literal['never', 'formerly', 'smokes', 'unknown'];
      avg_glucose_level: float = Field(gt=0)."
  - question: State Little's Law and use it to explain why latency rises sharply as a service approaches capacity.
    kind: short
    marks: 5
    keywords:
      - L = λW
      - concurrency
      - arrival rate
      - latency
      - utilisation
      - capacity
      - queue
      - 1 - ρ
      - nonlinear
    idealAnswer: "Little's Law: L = λW — average requests in the system equals arrival rate times average time in
      the system. As arrival rate approaches capacity (utilisation ρ → 1), requests queue; queueing models
      give W ≈ S/(1 − ρ), so latency grows nonlinearly — doubling at 50% and 10× at 90% — and requests in
      flight grow with it. Services are therefore sized for ~60–70% utilisation."
  - question: Design the /predict service for the stroke model so it is correct, fast and safe under hospital
      load. Cover the schema, model loading, concurrency model, error handling, capacity planning for 250
      req/s at 20 ms inference, and what you would monitor.
    kind: long
    marks: 12
    keywords:
      - pydantic
      - Field
      - Literal
      - "422"
      - lifespan
      - load once
      - pipeline
      - def
      - threadpool
      - uvicorn workers
      - capacity
      - utilisation
      - 70%
      - workers
      - p99
      - latency
      - error rate
      - model version
      - logging
    idealAnswer: "Schema: a Pydantic Patient model with typed, bounded fields (age 0–120, glucose > 0, optional
      BMI range, Literal categories) returning a Prediction model (probability, risk tier, model_version);
      invalid payloads get 422. Load the full joblib pipeline once per worker in the lifespan handler.
      Inference is CPU-bound, so use a def endpoint (threadpool) and scale with multiple Uvicorn workers.
      Capacity: one worker = 50 req/s; at 70% target utilisation 250 req/s needs 250/0.7/50 ≈ 7.1 → 8 workers
      (or replicas behind a load balancer). Errors: return clear 4xx for client issues, catch model errors as
      500 with a request id, never leak stack traces. Monitor request rate, p50/p99 latency, error rates,
      utilisation, input distributions (for drift) and model version, with structured logs per request."
  - question: Explain why a blocking (WSGI) server struggles under I/O-heavy model serving and how an ASGI server
      like FastAPI helps. Include the study result the deck cites.
    kind: short
    marks: 5
    keywords:
      - wsgi
      - asgi
      - blocking
      - thread
      - event loop
      - i/o-bound
      - 504
      - 67.8
      - 10.1
      - latency
    idealAnswer: A WSGI server such as Django gives each request a thread. When the request waits on I/O, such as
      an upload, a database query or a remote model call, the thread sits idle, queues fill and users see 504
      Gateway Timeout errors. An ASGI server such as FastAPI runs an event loop that serves other requests
      while one waits, so one process can handle many concurrent connections. The cited ICECCO 2026 study
      compared FastAPI microservices with a monolithic Django setup on an I/O-bound workload. FastAPI reached
      67.8 requests per second against 10.1 (about 6.7 times) and average latency of 6,634 ms against 48,841
      ms (about 7.4 times lower). This result is for I/O-bound work and does not show faster CPU computation.
  - question: Describe the five steps of serving a model behind an API, using one of the two real systems in the deck.
    kind: short
    marks: 5
    keywords:
      - load
      - receive
      - prepare
      - predict
      - respond
      - densenet121
      - fundus
      - 224
      - clahe
      - json
    idealAnswer: "Step 1, load: pre-trained weights are loaded into memory once at start-up. Step 2, receive: an
      endpoint such as POST /upload_file takes a file or JSON. Step 3, prepare: preprocess the data in memory.
      Step 4, predict: run the in-memory model. Step 5, respond: return class, confidence and explanation as
      JSON. In the diabetic retinopathy system, a user uploads a retinal fundus image through a multilingual
      chatbot. The image gets CLAHE contrast adjustment and is resized to 224 x 224 pixels. A pre-trained
      DenseNet121 model behind FastAPI classifies it into No DR, Mild/Moderate DR or Severe DR, and the result
      returns in real time. The client never sees the model internals."
  - question: Discuss how to secure an API that serves a model. Cover authentication, the three front-door
      defences, the flaws found in LLM-generated APIs and how to test.
    kind: long
    marks: 10
    keywords:
      - authentication
      - authorization
      - bearer token
      - rbac
      - parameterized queries
      - 429
      - retry-after
      - body size
      - mass assignment
      - race condition
      - sast
      - dast
    idealAnswer: "Authentication asks who is calling and authorization asks what they may do. API keys identify
      the calling application, bearer tokens prove identity on each request, OAuth 2.0 gives a standard token
      flow, and RBAC grants permissions by role. At the front door there are three defences. First, validate
      input with Pydantic rules and use parameterized queries to block SQL injection. Second, rate limit per
      key and answer HTTP 429 with a Retry-After header. Third, cap the request body size before parsing JSON
      so huge uploads cannot exhaust memory. A 2026 IEEE Access study found four flaws in LLM-generated APIs:
      mass assignment (an inherited role field allowed admin sign-up), execution ordering (huge JSON parsed
      before the key check, causing an OOM crash), race conditions (no row locking, so duplicate payments or
      webhooks) and the human-in-the-loop paradox (polished code invites shallow review). Code that compiles
      is not necessarily secure, and scanners miss business-logic flaws. So triangulate: SAST reads code
      (Bandit, Semgrep), DAST or fuzzing attacks the running API (Schemathesis, RESTler), and manual
      penetration tests follow OWASP WSTG."
coding:
  - id: patient-schema
    title: The Patient request schema
    language: python
    level: core
    prompt: |
      Define Pydantic models for the stroke API:

      - `Patient`: `age` float 0–120; `avg_glucose_level` float > 0; `bmi` optional float between 10 and 80
        (default `None`); `hypertension` and `heart_disease` bools; `smoking_status` one of
        `"never"`, `"formerly"`, `"smokes"`, `"unknown"`.
      - `Prediction`: `stroke_probability` float 0–1, `risk_tier` one of `"LOW"`, `"HIGH"`, `model_version` str.
    starter: |
      from typing import Literal
      from pydantic import BaseModel, Field

      class Patient(BaseModel):
          age: float
          avg_glucose_level: float
          bmi: float
          hypertension: bool
          heart_disease: bool
          smoking_status: str

      class Prediction(BaseModel):
          stroke_probability: float
          risk_tier: str
          model_version: str
    solution: |
      from typing import Literal
      from pydantic import BaseModel, Field

      class Patient(BaseModel):
          age: float = Field(ge=0, le=120)
          avg_glucose_level: float = Field(gt=0)
          bmi: float | None = Field(default=None, ge=10, le=80)
          hypertension: bool
          heart_disease: bool
          smoking_status: Literal["never", "formerly", "smokes", "unknown"]

      class Prediction(BaseModel):
          stroke_probability: float = Field(ge=0, le=1)
          risk_tier: Literal["LOW", "HIGH"]
          model_version: str
    tests:
      - name: A valid patient parses, BMI may be missing
        code: |
          p = Patient(age=67, avg_glucose_level=228, hypertension=True, heart_disease=False, smoking_status="formerly")
          assert p.bmi is None
      - name: Out-of-range values are rejected
        code: |
          from pydantic import ValidationError
          base = dict(age=67, avg_glucose_level=228, bmi=30, hypertension=True, heart_disease=False, smoking_status="never")
          for bad in [{"age": -12}, {"age": 150}, {"avg_glucose_level": 0}, {"bmi": 5}, {"smoking_status": "sometimes"}]:
              try:
                  Patient(**(base | bad))
                  raise AssertionError(f"{bad} should be rejected with a 422")
              except ValidationError:
                  pass
      - name: Predictions are bounded too
        code: |
          from pydantic import ValidationError
          Prediction(stroke_probability=0.41, risk_tier="HIGH", model_version="2.3.0")
          try:
              Prediction(stroke_probability=1.4, risk_tier="HIGH", model_version="2.3.0")
              raise AssertionError("a probability above 1 must be rejected")
          except ValidationError:
              pass
  - id: predict-endpoint
    title: The /predict service
    language: review
    level: exam
    prompt: |
      Write `app/main.py` for the stroke API using the `Patient` and `Prediction` models: load the joblib
      pipeline **once at startup** (lifespan), expose `GET /health` and `POST /predict`, return the model
      version from metadata, map probability ≥ the calibrated threshold (0.22) to `"HIGH"`, and keep the
      CPU-bound prediction off the event loop. Comment your decisions.
    starter: |
      from contextlib import asynccontextmanager
      from fastapi import FastAPI

      app = FastAPI()
    solution: |
      import json
      from contextlib import asynccontextmanager

      import joblib
      import pandas as pd
      from fastapi import FastAPI

      from app.schemas import Patient, Prediction

      THRESHOLD = 0.22  # calibrated on validation data for recall within clinic capacity

      @asynccontextmanager
      async def lifespan(app: FastAPI):
          # Load ONCE per worker; per-request loading would add disk I/O to every call.
          app.state.model = joblib.load("models/stroke_pipeline.joblib")
          app.state.meta = json.load(open("models/model_metadata.json"))
          yield

      app = FastAPI(title="Stroke risk API", lifespan=lifespan)

      @app.get("/health")
      def health():
          return {"status": "ok", "model_version": app.state.meta["model_version"]}

      @app.post("/predict", response_model=Prediction)
      def predict(patient: Patient) -> Prediction:   # plain def → runs in the threadpool (CPU-bound)
          row = pd.DataFrame([patient.model_dump()])  # Pydantic already rejected invalid input (422)
          p = float(app.state.model.predict_proba(row)[0, 1])
          return Prediction(stroke_probability=p, risk_tier="HIGH" if p >= THRESHOLD else "LOW",
                            model_version=app.state.meta["model_version"])
    rubric:
      - Loads the model once at startup (lifespan or module import), not inside the request handler
      - Uses the Pydantic Patient model as the request body so invalid input gets HTTP 422
      - Keeps CPU-bound inference off the event loop (plain def endpoint/threadpool or workers)
      - Applies the calibrated threshold (0.22) to produce the risk tier
      - Returns the model version (traceability) and provides a health endpoint
